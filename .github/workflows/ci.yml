name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Run adversarial demos (smoke test)
      run: |
        python linear_regression/adversarial_demo.py
        python perceptron/adversarial_demo.py
        python naive_bayes/adversarial_demo.py
      continue-on-error: true

    - name: Run benchmark (subset)
      run: |
        python -c "
        import sys, os
        sys.path.insert(0, os.getcwd())
        from benchmark import benchmark_naive_bayes, benchmark_naive_vs_optimized_gd
        benchmark_naive_bayes()
        benchmark_naive_vs_optimized_gd()
        print('Benchmark smoke test passed.')
        "
